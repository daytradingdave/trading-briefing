name: Dagelijkse briefing

on:
  schedule:
    # 06:03 en 07:03 UTC = ~08:03 in zomer- en wintertijd (NL); het script verstuurt alleen als het lokaal 08:xx is.
    # Ma t/m vr = dagbriefing, zondag = weekoverzicht.
    - cron: "3 6,7 * * 0-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "Wat wil je testen?"
        type: choice
        options: [daily, weekly]
        default: daily
      date:
        description: "Optioneel: doe alsof het deze datum is (YYYY-MM-DD), bijv. een doordeweekse dag"
        required: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  briefing:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/cache/restore@v4
        with:
          path: .state
          key: state-${{ github.run_id }}
          restore-keys: state-
      - name: Briefing versturen
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          TIMEZONE: Europe/Amsterdam
        run: python briefing.py ${{ inputs.mode || 'daily' }} ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }} ${{ inputs.date && format('--date {0}', inputs.date) || '' }}
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .state
          key: state-${{ github.run_id }}
